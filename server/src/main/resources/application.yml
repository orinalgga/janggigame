spring:
  application:
    name: janggi-server

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

janggi:
  cors:
    # 쉼표로 여러 개. 운영에서는 JANGGI_CORS_ALLOWED_ORIGINS 환경변수로 Cloudflare Pages 주소를 넣는다.
    allowed-origins: ${JANGGI_CORS_ALLOWED_ORIGINS:http://localhost:5173}
