spring:
  application:
    name: janggi-server
  datasource:
    url: ${DB_URL:jdbc:h2:mem:janggi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
  # Cloudflare 등 프록시 뒤에서도 구글 리디렉션 주소를 https 실제 주소로 만든다.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

janggi:
  # 소셜 로그인이 끝나면 돌아갈 웹 주소.
  web-base-url: ${JANGGI_WEB_BASE_URL:http://localhost:5173}
  # 앱에서 로그인하면 돌아갈 앱 주소. 앱의 AndroidManifest·Info.plist에 등록한 주소와 같아야 한다.
  # 관리자 페이지를 쓸 수 있는 구글 메일. 쉼표로 여러 개.
  admin-emails: ${JANGGI_ADMIN_EMAILS:}
  app-redirect-url: ${JANGGI_APP_REDIRECT_URL:com.janggi.app://auth}
  jwt:
    # 운영에서는 반드시 JANGGI_JWT_SECRET에 32자 이상 임의 문자열을 넣는다.
    secret: ${JANGGI_JWT_SECRET:local-dev-secret-change-me-0123456789}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  online:
    # 온라인 대국 시간 규칙: 각자 기본 시간에, 한 수 둘 때마다 증초가 더해진다.
    base-seconds: ${JANGGI_ONLINE_BASE_SECONDS:600}
    increment-seconds: ${JANGGI_ONLINE_INCREMENT_SECONDS:10}
  ai-chat:
    # ANTHROPIC_API_KEY가 있으면 AI 대국 채팅에서 Claude가 답한다. 없으면 정해 둔 말로 답한다.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${JANGGI_AI_CHAT_MODEL:claude-opus-5-5}
    # 한 대국에서 Claude에게 묻는 횟수 상한. 넘으면 정해 둔 말로 답한다.
    max-replies-per-game: ${JANGGI_AI_CHAT_MAX_REPLIES:40}
  cors:
    # 쉼표로 여러 개. 운영에서는 JANGGI_CORS_ALLOWED_ORIGINS 환경변수로 Cloudflare Pages 주소를 넣는다.
    # https://localhost는 안드로이드 앱, capacitor://localhost는 iOS 앱 화면의 주소다.
    allowed-origins: ${JANGGI_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost,capacitor://localhost}
  payments:
    # 지금은 돈이 오가지 않는 test만 있다. 실제 결제사를 붙이면 그 이름으로 바꾼다.
    provider: ${JANGGI_PAYMENTS_PROVIDER:test}
