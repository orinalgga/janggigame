<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아바타 그림 확인</title>
    <style>
      body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: #f3ece0; color: #2a2118; }

  <body>

    <div id="out"></div>
    <script type="module" src="/src/avatar/gallery.ts"></script>
