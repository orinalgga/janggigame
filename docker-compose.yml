# Oracle 무료 VM 한 대에 올리는 구성. Vue 웹은 Cloudflare Pages에 따로 배포한다.
services:
  server:
    # 배포 VM은 GitHub Actions가 만든 이 이미지를 받아 쓴다(deploy/update.sh). 로컬에서는 --build로 직접 만든다.
    image: ghcr.io/orinalgga/janggigame-server:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    # 바깥에는 caddy(80·443)만 연다. 8080은 그 컴퓨터 안에서만 열린다.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JANGGI_CORS_ALLOWED_ORIGINS: ${JANGGI_CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://localhost,capacitor://localhost}
      DB_URL: jdbc:postgresql://postgres:5432/janggi
      DB_USER: janggi
      DB_PASSWORD: ${POSTGRES_PASSWORD:-janggi}
      JANGGI_WEB_BASE_URL: ${JANGGI_WEB_BASE_URL:-http://localhost:5173}
      JANGGI_JWT_SECRET: ${JANGGI_JWT_SECRET:?32자 이상 임의 문자열을 .env에 넣으세요}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JANGGI_ADMIN_EMAILS: ${JANGGI_ADMIN_EMAILS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 메모리가 작은 VM에서는 .env에 JAVA_TOOL_OPTIONS=-Xmx384m 처럼 힙을 줄인다.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # 서버 앞에서 HTTPS 인증서를 자동으로 받아 붙인다. 배포 서버의 .env에 COMPOSE_PROFILES=prod를 넣으면 같이 뜬다.
  caddy:
    image: caddy:2
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      JANGGI_API_HOST: ${JANGGI_API_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: janggi
      POSTGRES_USER: janggi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janggi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 2단계(매칭 대기열, 진행 중 대국)부터 서버가 사용한다.
  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
