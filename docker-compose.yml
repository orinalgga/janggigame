# Oracle 무료 VM 한 대에 올리는 구성. Vue 웹은 Cloudflare Pages에 따로 배포한다.
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      JANGGI_CORS_ALLOWED_ORIGINS: ${JANGGI_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # 1단계(회원·기보)부터 서버가 사용한다.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: janggi
      POSTGRES_USER: janggi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janggi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 2단계(매칭 대기열, 진행 중 대국)부터 서버가 사용한다.
  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata:
